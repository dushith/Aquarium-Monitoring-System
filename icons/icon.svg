<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#082f49" />
    </linearGradient>
    <linearGradient id="fishGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.95" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded box -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Outer Glow circle -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#38bdf8" stroke-width="4" stroke-opacity="0.3" filter="url(#glow)" />

  <!-- Aquarium Tank Frame -->
  <rect x="96" y="116" width="320" height="280" rx="36" fill="#0f172a" fill-opacity="0.4" stroke="#7dd3fc" stroke-width="8" stroke-opacity="0.8"/>
  
  <!-- Water Fill inside tank -->
  <path d="M 104 220 Q 180 200, 256 220 T 408 220 L 408 360 Q 408 388, 380 388 L 132 388 Q 104 388, 104 360 Z" fill="url(#waterGrad)" />
  
  <!-- Bubbles -->
  <circle cx="160" cy="300" r="14" fill="#e0f2fe" fill-opacity="0.5" />
  <circle cx="180" cy="240" r="8" fill="#e0f2fe" fill-opacity="0.6" />
  <circle cx="340" cy="280" r="10" fill="#e0f2fe" fill-opacity="0.5" />
  <circle cx="355" cy="230" r="16" fill="#e0f2fe" fill-opacity="0.7" />

  <!-- Fish -->
  <g transform="translate(190, 250) scale(0.95)">
    <polygon points="120,40 160,10 150,40 160,70" fill="url(#fishGrad)" />
    <ellipse cx="70" cy="40" rx="60" ry="32" fill="url(#fishGrad)" />
    <path d="M 60 40 Q 40 65, 80 50 Z" fill="#fdba74" />
    <circle cx="35" cy="32" r="6" fill="#ffffff" />
    <circle cx="33" cy="32" r="3" fill="#0f172a" />
  </g>

  <!-- Seaweed plants at bottom -->
  <path d="M 140 388 Q 125 330, 145 280 Q 130 330, 145 388" stroke="#10b981" stroke-width="8" stroke-linecap="round" fill="none"/>
  <path d="M 370 388 Q 390 320, 365 260 Q 380 320, 375 388" stroke="#10b981" stroke-width="8" stroke-linecap="round" fill="none"/>

  <!-- Temperature & WiFi Icons mini badge -->
  <circle cx="400" cy="120" r="36" fill="#0284c7" stroke="#38bdf8" stroke-width="4" />
  <path d="M 395 105 L 405 105 L 405 125 A 8 8 0 1 1 395 125 Z" fill="#ffffff" />
</svg>
